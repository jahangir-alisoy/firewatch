<!doctype html>
<html lang="az" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FireWatch</title>
<script>
(function () {
  var t, l;
  try { t = localStorage.getItem('fw-theme'); l = localStorage.getItem('fw-lang'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.documentElement.lang = l === 'en' ? 'en' : 'az';
})();
</script>
<style>
:root{
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --r:26px; --spring:cubic-bezier(.3,1.45,.5,1);
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0a0b0d; --blob1:rgba(255,128,48,.20); --blob2:rgba(70,120,200,.20);
  --glass:rgba(32,34,38,.36); --soft:rgba(255,255,255,.06); --thumb:rgba(255,255,255,.16);
  --rim1:rgba(255,255,255,.45); --rim2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.08); --track:rgba(255,255,255,.09);
  --ink:#f5f5f3; --ink2:rgba(245,245,243,.7); --muted:rgba(245,245,243,.42);
  --shadow:0 26px 60px -26px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.22);
  --amb:.6; --tip:rgba(22,23,26,.9);
}
[data-theme=light]{
  color-scheme:light;
  --bg:#eceef1; --blob1:rgba(255,166,100,.38); --blob2:rgba(110,165,240,.32);
  --glass:rgba(255,255,255,.5); --soft:rgba(255,255,255,.55); --thumb:rgba(255,255,255,.95);
  --rim1:rgba(255,255,255,.95); --rim2:rgba(255,255,255,.4);
  --line:rgba(17,18,21,.08); --track:rgba(17,18,21,.08);
  --ink:#111215; --ink2:rgba(17,18,21,.68); --muted:rgba(17,18,21,.42);
  --shadow:0 24px 50px -28px rgba(30,40,60,.4),0 1px 3px rgba(30,40,60,.08);
  --amb:.4; --tip:rgba(255,255,255,.92);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink);transition:background .4s}
body{min-height:100vh;font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(60vmax 45vmax at 12% 8%,var(--blob1),transparent 62%),
             radial-gradient(60vmax 45vmax at 92% 88%,var(--blob2),transparent 62%)}
#amb{position:fixed;left:-8%;top:-8%;width:116%;height:116%;z-index:-1;pointer-events:none;
     filter:blur(60px) saturate(1.6);opacity:0;transition:opacity 1s}
body.cam #amb{opacity:var(--amb)}
.aura{position:fixed;inset:0;z-index:60;pointer-events:none;transition:box-shadow .6s}
body.s-warn .aura{box-shadow:inset 0 0 140px -30px rgba(250,178,25,.55)}
body.s-alarm .aura{box-shadow:inset 0 0 180px -20px rgba(208,59,59,.75);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,time{font-variant-numeric:tabular-nums}

/* ---------- glass ---------- */
.glass{position:relative;background:var(--glass);border-radius:var(--r);isolation:isolate;
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--rim1),inset 0 0 0 1px var(--rim2)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,var(--rim1),transparent 30%,transparent 70%,var(--rim2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

.wrap{max-width:1480px;margin:0 auto;padding:14px 20px 28px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:12px;z-index:30;display:flex;align-items:center;gap:8px;
     padding:7px 7px 7px 18px;border-radius:999px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;letter-spacing:-.01em;margin-right:auto}
.brand svg{color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;
      background:var(--soft);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s,box-shadow .3s}
.dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}
.dot.off{background:var(--crit)} .dot.wait{background:var(--warn);box-shadow:0 0 10px var(--warn)}
#clock{font:500 12px var(--mono);color:var(--muted);padding:0 8px}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;
     border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{position:relative;z-index:1;height:28px;min-width:38px;padding:0 9px;border:0;background:none;
  color:var(--muted);font-weight:650;font-size:12px;letter-spacing:.05em;cursor:pointer;border-radius:999px;
  display:grid;place-items:center;transition:color .25s,transform .4s var(--spring)}
.seg button svg.i{width:16px;height:16px}
.seg button.on{color:var(--ink);transform:scale(1.08)}
.seg .thumb{position:absolute;top:3px;left:0;height:28px;border-radius:999px;background:var(--thumb);z-index:0;
  pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 1px 0 var(--rim1),inset 0 0 0 1px var(--rim2);
  transition:transform .5s var(--spring),width .3s}
.lg .seg .thumb{z-index:2;background:rgba(255,255,255,.07)}
.lg .seg button.on{transform:none}

/* ---------- layout ---------- */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 340px;
      grid-template-areas:"feed side" "chart ev"}
.feed{grid-area:feed} .side{grid-area:side;display:flex;flex-direction:column;gap:16px}
.chartc{grid-area:chart} .evc{grid-area:ev}
.card{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);
    font-size:12px;font-weight:550;letter-spacing:.02em;margin-bottom:10px}
.hd span{display:inline-flex;align-items:center;gap:7px}

/* ---------- camera ---------- */
.feed{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#050506;
      box-shadow:var(--shadow),0 0 0 1px var(--line)}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.chip{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;
  border-radius:999px;color:#fff;font-weight:600;font-size:13px;background:rgba(18,18,20,.26);
  -webkit-backdrop-filter:blur(8px) saturate(160%);backdrop-filter:blur(8px) saturate(160%);
  box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.12);
  transition:background .3s}
.chip.tl{top:14px;left:14px;font:600 12px var(--mono)}
.chip.tr{top:14px;right:14px;font-weight:550;font-size:12px}
.rec{width:7px;height:7px;border-radius:50%;background:var(--crit);box-shadow:0 0 8px var(--crit);animation:breathe 2s infinite}
.vis{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;z-index:3}
.vis .chip{position:relative;min-width:92px}
.vis .chip.hot{background:rgba(208,59,59,.55)}
.vis .chip.warm{background:rgba(190,130,10,.5)}
.nosig{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:10px;color:rgba(255,255,255,.45);font-size:13px}
.nosig svg.i{width:30px;height:30px;stroke-width:1.4}
.feed.off .nosig{display:grid} .feed.off img,.feed.off .chip,.feed.off .vis{display:none}

/* ---------- level ---------- */
.lv-top{display:flex;align-items:center;justify-content:space-between}
.state{display:inline-flex;align-items:center;gap:9px;font-weight:650;font-size:15px}
.shape{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);transition:all .3s}
.s-warn .shape{background:var(--warn);box-shadow:none;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.s-alarm .shape{background:var(--crit);box-shadow:none;border-radius:1px;width:9px;height:9px;transform:rotate(45deg)}
.big{display:flex;align-items:baseline;gap:6px;margin:6px 0 16px}
.big b{font-size:108px;line-height:.92;font-weight:620;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:550}
.lvbar{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.lvbar i{height:26px;border-radius:8px;background:var(--track);transition:background .25s,box-shadow .25s}
.lvbar i.on.g{background:var(--good);box-shadow:0 0 16px -3px var(--good),inset 0 1px 0 rgba(255,255,255,.5)}
.lvbar i.on.y{background:var(--warn);box-shadow:0 0 16px -3px var(--warn),inset 0 1px 0 rgba(255,255,255,.55)}
.lvbar i.on.r{background:var(--crit);box-shadow:0 0 16px -3px var(--crit),inset 0 1px 0 rgba(255,255,255,.4)}
.src{display:flex;gap:16px;margin-top:14px;color:var(--ink2);font-size:13px}
.src span{display:inline-flex;align-items:center;gap:6px} .src b{font-weight:600;color:var(--ink)}
.src svg.i{width:16px;height:16px;color:var(--muted)}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;
  background:var(--soft);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,transform .3s var(--spring)}
.ibtn:hover{transform:scale(1.06)} .ibtn:disabled{opacity:.35;cursor:default;transform:none}
.ibtn.on{background:var(--warn);color:#111}

/* ---------- sensors ---------- */
.row{display:grid;grid-template-columns:30px 1fr auto 72px;align-items:center;gap:10px;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--ink2);
    box-shadow:inset 0 0 0 1px var(--line)}
.ic svg.i{width:16px;height:16px}
.nm{color:var(--ink2)}
.val{font-size:19px;font-weight:620;letter-spacing:-.01em;text-align:right}
.val small{font-size:12px;color:var(--muted);font-weight:550;margin-left:2px}
.row canvas{width:72px;height:26px}
.hint{display:none;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding-top:8px}
.hint.show{display:flex}

/* ---------- chart & events ---------- */
.chart{position:relative;height:176px}
.chart canvas{width:100%;height:100%;display:block}
.tip.glass{background:var(--tip)}
.tip{position:absolute;top:4px;display:none;padding:9px 12px;border-radius:14px;font-size:12px;line-height:1.6;
     color:var(--ink2);white-space:nowrap;pointer-events:none;z-index:2}
.tip b{color:var(--ink);font-weight:650}
.evs{list-style:none;max-height:176px;overflow:auto;scrollbar-width:thin}
.evs li{display:grid;grid-template-columns:64px 12px 1fr;gap:6px;align-items:center;padding:5px 0;font-size:13px;color:var(--ink2)}
.evs time{font:12px var(--mono);color:var(--muted)}
.evs i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.evs .ok i{background:var(--good)} .evs .warn i{background:var(--warn)}
.evs .warning i{background:var(--warn);border-radius:0;width:8px;height:7px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.evs .alarm i{background:var(--crit);border-radius:1px;transform:rotate(45deg)}
.evs .alarm span{color:var(--ink);font-weight:650}

.toast{position:fixed;left:50%;bottom:22px;z-index:70;display:flex;align-items:center;gap:9px;padding:10px 16px;
  border-radius:999px;font-weight:550;transform:translate(-50%,30px);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .45s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"feed" "side" "chart" "ev"}
}
@media (max-width:600px){
  .wrap{padding:10px 12px 22px}
  .bar{padding-left:14px;gap:6px}
  .brand b,#clock{display:none}
  .pill{padding:0 9px}
  .seg button{min-width:34px;padding:0 7px}
  .big b{font-size:88px}
  .vis .chip{min-width:0}
  .chip{height:30px;padding:0 10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="aura"></div>

  <symbol id="i-ir" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>

</svg>

<div class="wrap">
  <header class="bar glass" data-lg="8,22,18">
    <div class="brand"><svg class="i"><use href="#i-flame"/></svg><b>FireWatch</b></div>
    <span class="pill" id="pCam"><svg class="i"><use href="#i-cam"/></svg><i class="dot" id="dCam"></i></span>
    <span class="pill" id="pLink"><svg class="i"><use href="#i-chip"/></svg><i class="dot" id="dLink"></i></span>
    <time id="clock">--:--:--</time>
    <div class="seg" id="segLang">
      <span class="thumb" data-lg-thumb></span>
      <button data-v="az">AZ</button><button data-v="en">EN</button>
    </div>
    <div class="seg" id="segTheme">
      <span class="thumb" data-lg-thumb></span>
      <button data-v="light" data-t="light"><svg class="i"><use href="#i-sun"/></svg></button>
      <button data-v="dark" data-t="dark"><svg class="i"><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <main class="grid">
    <section class="feed off" id="feed">
      <img id="video" alt="">
      <div class="chip tl" data-lg="6,14,10"><i class="rec"></i><span id="fps">0</span>&nbsp;fps</div>
      <div class="chip tr" id="model" data-lg="6,14,10">—</div>
      <div class="vis">
        <div class="chip" id="cFire" data-lg="6,14,10"><svg class="i"><use href="#i-flame"/></svg><span class="num" id="vFire">0%</span></div>
        <div class="chip" id="cSmoke" data-lg="6,14,10"><svg class="i"><use href="#i-smoke"/></svg><span class="num" id="vSmoke">0%</span></div>
      </div>
      <div class="nosig"><svg class="i"><use href="#i-camoff"/></svg><span data-i18n="noCam"></span></div>
    </section>

    <aside class="side">
      <section class="card glass" id="level" data-lg="20,26,18">
        <div class="lv-top">
          <span class="state"><i class="shape"></i><span id="stateLabel"></span></span>
          <button class="ibtn" id="mute" data-t="mute"><svg class="i"><use href="#i-belloff"/></svg></button>
        </div>
        <div class="big"><b id="lvl">0</b><small>/10</small></div>
        <div class="lvbar" id="lvbar"></div>
        <div class="src">
          <span data-t="cam"><svg class="i"><use href="#i-cam"/></svg><b id="srcV">0</b></span>
          <span data-t="sensors"><svg class="i"><use href="#i-chip"/></svg><b id="srcS">—</b></span>
        </div>
      </section>

      <section class="card glass" data-lg="20,26,18">
        <div class="hd"><span><svg class="i"><use href="#i-chip"/></svg><span data-i18n="sensors"></span></span><span class="num" id="sLvl"></span></div>
        <div class="row" id="rGas"><span class="ic"><svg class="i"><use href="#i-smoke"/></svg></span><span class="nm" data-i18n="smoke"></span><span class="val num" id="gas">—</span><canvas id="spGas"></canvas></div>
        <div class="row" id="rTemp"><span class="ic"><svg class="i"><use href="#i-temp"/></svg></span><span class="nm" data-i18n="heat"></span><span class="val num" id="temp">—</span><canvas id="spTemp"></canvas></div>
        <div class="row" id="rFlame"><span class="ic"><svg class="i"><use href="#i-ir"/></svg></span><span class="nm" data-i18n="flame"></span><span class="val num" id="flame">—</span><canvas id="spFlame"></canvas></div>
        <div class="hint" id="hint"></div>
      </section>
    </aside>

    <section class="card glass chartc" data-lg="20,26,18">
      <div class="hd"><span data-i18n="last5"></span><span class="num" id="peak"></span></div>
      <div class="chart" id="chart"><canvas id="cv"></canvas><div class="tip glass" id="tip"></div></div>
    </section>

    <section class="card glass evc" data-lg="20,26,18">
      <div class="hd"><span data-i18n="events"></span></div>
      <ul class="evs" id="events"></ul>
    </section>
  </main>
</div>

<div class="toast glass" id="toast"><svg class="i"><use href="#i-wifi"/></svg><span data-i18n="offline"></span></div>

             link_off:'Sensors offline', snapshot:'Snapshot saved', mute:'Buzzer muted', model_err:'Model error' } },
};
const $ = id => document.getElementById(id);
const root = document.documentElement;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const WINDOW = 300;
let lang = root.lang === 'en' ? 'en' : 'az';
const t = k => T[lang][k] ?? k;
let hist = [], last = null, hover = null, lastEvent = -1, camOn = false;

/* ---------------- liquid glass (Chromium: refraction through SVG displacement) ---------------- */
const UA = navigator.userAgent;
const LG = /Chrome\/|Chromium\/|Edg\//.test(UA) && !/Firefox|FxiOS|CriOS|EdgiOS/.test(UA);
if (LG) root.classList.add('lg');
const NS = 'http://www.w3.org/2000/svg';
let fxN = 0;

function buildMap(w, h, radius, o) {
  const s = w * h > 90000 ? 0.5 : 1;
  const mw = Math.max(2, Math.round(w * s)), mh = Math.max(2, Math.round(h * s));
  const r = Math.min(radius, w / 2, h / 2), band = o.band, edge = o.edge, mag = o.mag || 1;
  const ox = new Float32Array(mw * mh), oy = new Float32Array(mw * mh);
  let max = 0.01;
  for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) {
    const px = (i + .5) / s, py = (j + .5) / s;
    const qx = Math.min(Math.max(px, r), w - r), qy = Math.min(Math.max(py, r), h - r);
    const vx = px - qx, vy = py - qy, len = Math.hypot(vx, vy);
    let dist, nx = 0, ny = 0, dx = 0, dy = 0;
    if (len > 0) { dist = r - len; nx = vx / len; ny = vy / len; }
    else {
      const d = [px, w - px, py, h - py]; dist = Math.min(...d);
      const k = d.indexOf(dist); if (k === 0) nx = -1; else if (k === 1) nx = 1; else if (k === 2) ny = -1; else ny = 1;
    }
    if (dist < band && dist > -2) {                 // edge band: sample inward -> light bends at the rim
      const m = Math.pow(1 - Math.max(0, dist) / band, 2) * edge;
      dx -= nx * m; dy -= ny * m;
    }
    if (mag !== 1) { dx -= (px - w / 2) * (1 - 1 / mag); dy -= (py - h / 2) * (1 - 1 / mag); }  // lens
    const k = j * mw + i; ox[k] = dx; oy[k] = dy;
    max = Math.max(max, Math.abs(dx), Math.abs(dy));
  }
  const scale = max * 2.02;
  const c = document.createElement('canvas'); c.width = mw; c.height = mh;
  const g = c.getContext('2d'), im = g.createImageData(mw, mh);
  for (let k = 0; k < mw * mh; k++) {
    im.data[k * 4] = Math.round(127.5 + ox[k] / scale * 255);
    im.data[k * 4 + 1] = Math.round(127.5 + oy[k] / scale * 255);
    im.data[k * 4 + 2] = 128; im.data[k * 4 + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  return { url: c.toDataURL(), scale };
}

function makeFilter(el, w, h, o) {
  const rad = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
  const { url, scale } = buildMap(w, h, rad, o);
  let f = el._lgf;
  if (!f) { f = document.createElementNS(NS, 'filter'); f.id = 'lg' + (++fxN); $('fx').appendChild(f); el._lgf = f; }
  for (const [k, v] of Object.entries({ x: 0, y: 0, width: w, height: h, filterUnits: 'userSpaceOnUse',
       primitiveUnits: 'userSpaceOnUse', 'color-interpolation-filters': 'sRGB' })) f.setAttribute(k, v);
  f.innerHTML = `<feImage href="${url}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>` +
    `<feDisplacementMap in="SourceGraphic" in2="m" scale="${scale.toFixed(2)}" xChannelSelector="R" yChannelSelector="G"/>`;
  return f.id;
}

function liquid(el) {
  const r = el.getBoundingClientRect(), w = Math.round(r.width), h = Math.round(r.height);
  if (w < 8 || h < 8 || (el._w === w && el._h === h)) return;
  el._w = w; el._h = h;
  let o;
  if (el.hasAttribute('data-lg-thumb')) o = { blur: 0, edge: 4, band: 8, mag: 1.32, sat: 130 };
  else { const [blur, edge, band] = el.dataset.lg.split(',').map(Number); o = { blur, edge, band }; }
  const id = makeFilter(el, w, h, o);
  const bf = `url(#${id})${o.blur ? ` blur(${o.blur}px)` : ''} saturate(${o.sat || 170}%)`;
  el.style.backdropFilter = bf; el.style.webkitBackdropFilter = bf;
}

if (LG) {
  const targets = document.querySelectorAll('[data-lg],[data-lg-thumb]');
  let pend = new Set(), timer = 0;
  const ro = new ResizeObserver(es => {
    es.forEach(e => pend.add(e.target));
    clearTimeout(timer);
    timer = setTimeout(() => { pend.forEach(liquid); pend = new Set(); }, 120);
  });
  targets.forEach(el => ro.observe(el));
}

/* ---------------- segmented controls ---------------- */
function setSeg(id, v) {
  const seg = $(id), th = seg.querySelector('.thumb');
  seg.querySelectorAll('button').forEach(b => {
    const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    if (on) { th.style.width = b.offsetWidth + 'px'; th.style.transform = `translateX(${b.offsetLeft}px)`; }
  });
}
$('segLang').onclick = e => { const b = e.target.closest('button'); if (b) { lang = b.dataset.v; store.set('fw-lang', lang); applyLang(); } };
$('segTheme').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  root.dataset.theme = b.dataset.v; store.set('fw-theme', b.dataset.v); setSeg('segTheme', b.dataset.v); redraw();
};

function applyLang() {
  root.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-t]').forEach(el => { el.title = t(el.dataset.t); el.setAttribute('aria-label', el.title); });
  setSeg('segLang', lang);
  lastEvent = -1;
  if (last) render(last);
}

/* ---------------- level bar (mirrors the 10 LEDs: 3 green, 3 yellow, 4 red) ---------------- */
for (let i = 0; i < 10; i++) {
  const s = document.createElement('i'); s.className = i < 3 ? 'g' : i < 6 ? 'y' : 'r'; $('lvbar').appendChild(s);
}

/* ---------------- websocket ---------------- */
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { $('toast').classList.remove('show'); $('video').src = '/video?' + Date.now(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'init') { hist = m.history; return; }
    if (m.point && (!hist.length || m.point.t > hist[hist.length - 1].t)) hist.push(m.point);
    const cut = Date.now() / 1000 - WINDOW;
    while (hist.length && hist[0].t < cut) hist.shift();
    last = m; render(m);
  };
  ws.onclose = () => { $('toast').classList.add('show'); setTimeout(connect, 1500); };
}

const pct = v => Math.round(v * 100) + '%';
const hms = s => new Date(s * 1000).toLocaleTimeString('en-GB', { hour12: false });
const dot = (id, cls) => $(id).className = 'dot ' + cls;

function render(m) {
  const sKey = m.state.toLowerCase();
  document.body.classList.toggle('s-warn', m.state === 'WARNING');
  document.body.classList.toggle('s-alarm', m.state === 'ALARM');
  $('level').className = 'card glass ' + (m.state === 'WARNING' ? 's-warn' : m.state === 'ALARM' ? 's-alarm' : '');
  $('stateLabel').textContent = t(sKey);
  $('lvl').textContent = m.level;
  [...$('lvbar').children].forEach((s, i) => s.classList.toggle('on', i < m.level));
  document.title = (m.state === 'CLEAR' ? '' : `${t(sKey)} ${m.level}/10 · `) + 'FireWatch';

  const v = m.vision;
  camOn = v.cam;
  document.body.classList.toggle('cam', v.cam);
  $('feed').classList.toggle('off', !v.cam);
  dot('dCam', v.cam ? 'on' : 'off');
  $('pCam').title = `${t('cam')} · ${v.cam ? Math.round(v.fps) + ' fps' : '—'}`;
  $('fps').textContent = Math.round(v.fps);
  $('model').textContent = v.model.split(' · ')[0]; $('model').title = v.model;
  $('vFire').textContent = pct(v.fire); $('vSmoke').textContent = pct(v.smoke);
  $('cFire').className = 'chip' + (v.fire >= .5 ? ' hot' : v.fire >= .25 ? ' warm' : '');
  $('cSmoke').className = 'chip' + (v.smoke >= .5 ? ' hot' : v.smoke >= .25 ? ' warm' : '');
  $('cFire').title = t('fire'); $('cSmoke').title = t('smoke');
  $('srcV').textContent = v.level;

  const s = m.sensors, L = m.link;
  dot('dLink', L.online ? (s && s.warm ? 'wait' : 'on') : 'off');
  $('pLink').title = `${t('sensors')} · ${L.online ? (L.sim ? 'sim' : L.port) : '—'}`;
  $('mute').disabled = !L.online;
  $('mute').classList.toggle('on', !!(s && s.muted));
  $('mute').title = t(s && s.muted ? 'muted' : 'mute');
  const hint = $('hint');
  if (!s) {
    ['gas', 'temp', 'flame'].forEach(k => $(k).textContent = '—');
    $('sLvl').textContent = ''; $('srcS').textContent = '—';
    hint.className = 'hint show'; hint.textContent = t('noLink');
  } else {
    hint.className = 'hint' + (s.warm ? ' show' : ''); hint.textContent = t('warm');
    $('sLvl').textContent = s.local + '/10'; $('srcS').textContent = s.local;
    $('gas').innerHTML = `+${s.gas}`;
    $('rGas').title = `MQ-2 · raw ${s.smoke_raw} · base ${s.smoke_base}`;
    $('temp').innerHTML = `${s.temp.toFixed(1)}<small>°C</small>`;
    $('flame').innerHTML = `${Math.round(s.flame * 100)}<small>%</small>`;
  }
  redraw();
  events(m.events);
}

function redraw() {
  spark('spGas', hist.map(p => p.gas), 0, 400);
  spark('spTemp', hist.map(p => p.temp), null, null);
  spark('spFlame', hist.map(p => p.flame), 0, 1);
  chart();
}

/* ---------------- canvas ---------------- */
function fit(c) {
  const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
  const W = Math.round(r.width * d), H = Math.round(r.height * d);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const g = c.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}

function spark(id, vals, lo, hi) {
  const [g, w, h] = fit($(id));
  const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return;
  const ys = pts.map(p => p[1]);
  let a = lo ?? Math.min(...ys), b = hi ?? Math.max(...ys);
  if (lo == null) { const pad = Math.max(.5, (b - a) * .2); a -= pad; b += pad; }
  b = Math.max(b, Math.max(...ys));
  const n = vals.length - 1, X = i => 2 + i / n * (w - 6), Y = v => h - 3 - (v - a) / (b - a || 1) * (h - 6);
  g.strokeStyle = css('--ink2'); g.lineWidth = 1.5; g.lineJoin = g.lineCap = 'round';
  g.beginPath(); pts.forEach(([i, v], k) => k ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke();
  const [li, lv] = pts[pts.length - 1];
  g.fillStyle = css('--ink'); g.beginPath(); g.arc(X(li), Y(lv), 2.5, 0, 7); g.fill();
}

function chart() {
  const [g, w, h] = fit($('cv'));
  const L = 24, R = 6, Tp = 8, B = 22, now = Date.now() / 1000;
  const X = s => L + (s - (now - WINDOW)) / WINDOW * (w - L - R);
  const Y = v => Tp + (1 - v / 10) * (h - Tp - B);
  g.font = '11px ' + css('--font'); g.textBaseline = 'middle';
  for (const v of [0, 4, 7, 10]) {
    g.strokeStyle = v === 0 ? css('--muted') : css('--line'); g.lineWidth = 1;
    g.setLineDash(v === 4 || v === 7 ? [3, 4] : []);
    g.beginPath(); g.moveTo(L, Math.round(Y(v)) + .5); g.lineTo(w - R, Math.round(Y(v)) + .5); g.stroke();
    g.fillStyle = css('--muted'); g.textAlign = 'right'; g.fillText(v, L - 8, Y(v));
  }
  g.setLineDash([]); g.textBaseline = 'top';
  g.textAlign = 'left'; g.fillText(`−5 ${t('min')}`, L, h - B + 7);
  g.textAlign = 'right'; g.fillText(t('now'), w - R, h - B + 7);
  if (hist.length < 2) { $('peak').textContent = ''; return; }
  g.strokeStyle = css('--ink'); g.lineWidth = 2; g.lineJoin = 'round';
  g.beginPath();
  hist.forEach((p, i) => {
    const x = X(p.t), y = Y(p.level);
    if (!i) g.moveTo(x, y); else { g.lineTo(x, Y(hist[i - 1].level)); g.lineTo(x, y); }
  });
  g.stroke();
  $('peak').textContent = `${t('peak')} ${Math.max(...hist.map(p => p.level))}/10`;
  const tip = $('tip');
  if (hover == null) { tip.style.display = 'none'; return; }
  let best = hist[0];
  for (const p of hist) if (Math.abs(X(p.t) - hover) < Math.abs(X(best.t) - hover)) best = p;
  const x = X(best.t);
  g.strokeStyle = css('--muted'); g.lineWidth = 1;
  g.beginPath(); g.moveTo(Math.round(x) + .5, Tp); g.lineTo(Math.round(x) + .5, h - B); g.stroke();
  g.fillStyle = css('--ink'); g.strokeStyle = css('--bg'); g.lineWidth = 2;
  g.beginPath(); g.arc(x, Y(best.level), 4.5, 0, 7); g.fill(); g.stroke();
  tip.innerHTML = `<b>${best.level}/10</b> · ${hms(best.t)}<br>${t('fire')} ${pct(best.fire)} · ${t('smoke')} ${pct(best.smoke)}` +
    (best.temp != null ? `<br>${best.temp.toFixed(1)} °C · +${best.gas}` : '');
  tip.style.display = 'block';
  tip.style.left = Math.min(Math.max(0, x + 12), w - tip.offsetWidth) + 'px';
}
$('chart').addEventListener('mousemove', e => { hover = e.clientX - $('chart').getBoundingClientRect().left; chart(); });
$('chart').addEventListener('mouseleave', () => { hover = null; chart(); });

function evText(e) {
  if (e.text) return e.text;
  const a = e.args || {};
  if (e.code === 'state') return `${t(String(a.state).toLowerCase())} · ${a.level}/10`;
  return T[lang].ev[e.code] || e.code;
}
function events(list) {
  if (!list.length || list[list.length - 1].id === lastEvent) return;
  lastEvent = list[list.length - 1].id;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('events').innerHTML = list.slice().reverse().map(e => {
    const detail = Object.entries(e.args || {}).map(([k, v]) => `${k}: ${v}`).join(' · ');
    return `<li class="${e.kind}" title="${esc(detail)}"><time>${hms(e.t)}</time><i></i><span>${esc(evText(e))}</span></li>`;
  }).join('');
}

/* ---------------- ambient backdrop from the live camera ---------------- */
const video = $('video'), actx = $('amb').getContext('2d');
setInterval(() => { if (camOn && video.naturalWidth) try { actx.drawImage(video, 0, 0, 48, 27); } catch (e) {} }, 300);

$('mute').onclick = () => fetch('/api/mute', { method: 'POST' });
setInterval(() => $('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour12: false }), 1000);
addEventListener('resize', () => { chart(); setSeg('segLang', lang); setSeg('segTheme', root.dataset.theme); });

setSeg('segTheme', root.dataset.theme);
applyLang();
connect();
</script>
</body>
</html>
